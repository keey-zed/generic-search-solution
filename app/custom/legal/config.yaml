# app/custom/legal/config.yaml
#
# Reference example for the v0 config schema (app/core/config/models.py).
# Validate with:
#   PYTHONPATH=. python3 -c "from app.core.config import load_use_case_config; print(load_use_case_config('app/custom/legal/config.yaml'))"

schema_version: 1

filters:
  mandatory_keywords:
    type: string
    required: false
    operation: contains

  subjects:
    type: list
    item_type: string
    required: false
    operation: contains

  signatures:
    type: string
    required: false
    operation: equality

  file_name:
    type: string
    required: false
    operation: equality

  law_number:
    type: string
    required: false
    operation: contains

  document_type:
    type: string
    required: true
    operation: equality

  publication_date:
    type: date
    required: false
    operation: range

  promulgation_date:
    type: date
    required: false
    operation: range

search:
  semantic:
    enabled: true
    multi_query_combination: max_score
    embedder:
      provider: sentence_transformer
      model: intfloat/multilingual-e5-large
      document_prefix: "passage: "
      query_prefix: "query: "
      # device: cpu           # uncomment to force cpu/cuda/mps; default auto-detects
      batch_size: 32
      cache_path: data/embeddings/legal.safetensors
  lexical:
    enabled: true
  ranking:
    strategy: weighted_sum
    weights:
      semantic: 0.6
      lexical: 0.4
  pagination:
    default_page_size: 20
    max_page_size: 100

frontend:
  branding:
    title: "البحث في النصوص القانونية"
    page_title: "Law, Simplified"
    subtitle: null
    favicon_url: "/assets/legal_favicon.ico"
    primary_color: "#a8562f"
    search_placeholder: "اكتب استعلامًا ثم اضغط Enter"
    semantic_search_placeholder: "اكتب استعلامًا قانونيًا واحدًا، ويمكن أن يحتوي على عدة أسطر"
    direction: rtl
  labels:
    search_button: "بحث"
    admin_link: "لوحة الإدارة"
    show_filters: "إظهار فلاتر البحث المتقدم"
    hide_filters: "إخفاء الفلاتر"
    reset: "إعادة التعيين"
    apply_filters: "تطبيق الفلتر"
    result_count: "عدد النتائج"
    no_results: "لم يتم العثور على نتائج."
    empty_state: "ابدأ بالبحث في النصوص القانونية لعرض النتائج."
    previous: "السابق"
    next: "التالي"
    semantic_search: "تفعيل البحث الدلالي (اختياري)"
    semantic_search_hint: "البحث الدلالي متاح فقط عند إدخال استعلام واحد."
    semantic_search_placeholder: "اكتب استعلامًا قانونيًا واحدًا، ويمكن أن يحتوي على عدة أسطر"
    facets_error: "تعذر تحميل خيارات الفلاتر من الخادم."
  filters:
    mandatory_keywords:
      label: "الكلمات الإلزامية"
      control: text
      order: 1
      placeholder: "أدخل الكلمات ثم اضغط Enter أو افصل بينها بفاصلة"
    subjects:
      label: "الموضوعات"
      control: multi_select
      order: 2
      placeholder: "اختر الموضوعات"
    signatures:
      label: "التوقيعات"
      control: dropdown
      order: 3
      placeholder: "اختر التوقيعات"
    file_name:
      label: "اسم الملف"
      control: dropdown
      order: 4
      placeholder: "اختر الملفات"
    law_number:
      label: "رقم القانون"
      control: text
      order: 6
      placeholder: "ابدأ بكتابة رقم القانون..."
    document_type:
      label: "نوع الوثيقة"
      control: dropdown
      order: 5
    publication_date:
      label: "تاريخ النشر"
      order: 7
      placeholder: "شهر / سنة"
    promulgation_date:
      label: "تاريخ الإصدار"
      order: 8
      placeholder: "شهر / سنة"
  result_card_fields: [document_type, publication_date, promulgation_date, file_name, law_number]
